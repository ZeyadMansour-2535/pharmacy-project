<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>دخول فريق الصيدلية | H&M</title>

    <link rel="stylesheet" href="CSS/Style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="index.html" class="logo">
            H<span>&</span>M
        </a>

    </div>

</header>

<section class="section">

    <div class="container">

        <div class="login-box">

            <h2><i data-lucide="lock-keyhole" aria-hidden="true"></i> دخول فريق الصيدلية</h2>

            <form onsubmit="loginTeam(event)">

                <div class="form-group">

                    <label>
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        required>

                </div>

                <div class="form-group">

                    <label>
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-green"
                    style="width:100%">

                    تسجيل الدخول

                </button>

            </form>

            <p class="login-note">
                هذه الصفحة مخصصة لفريق صيدليات H&M فقط.
            </p>

        </div>

    </div>

</section>

<script src="JS/Script.JS"></script>

</body>
</html>
